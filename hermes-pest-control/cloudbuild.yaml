substitutions:
  _REGION: europe-west1
  _SERVICE_NAME: hermes-pest-control-backend
  _IMAGE_NAME: hermes-pest-control-backend

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/hermes/${_IMAGE_NAME}:$SHORT_SHA
      - backend

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/hermes/${_IMAGE_NAME}:$SHORT_SHA

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE_NAME}
      - --image
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/hermes/${_IMAGE_NAME}:$SHORT_SHA
      - --region
      - ${_REGION}
      - --platform
      - managed
      - --allow-unauthenticated
      - --set-env-vars
      - APP_ENV=production,AUTH_MODE=firebase,FIREBASE_AUTH_ENABLED=true,FIREBASE_PROJECT_ID=$PROJECT_ID,HERMES_MODE=mock

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/hermes/${_IMAGE_NAME}:$SHORT_SHA
